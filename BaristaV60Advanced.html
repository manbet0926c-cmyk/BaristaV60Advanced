<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista 4:6 Pro - V60 Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de colores Latte & Espresso */
            --bg-grad-start: #fdfbf7;
            --bg-grad-end: #e6ded5;
            --card-bg: #ffffff;
            --primary-text: #3e2723;   /* Marrón muy oscuro */
            --accent-color: #d7ccc8;   /* Espuma */
            --highlight: #795548;      /* Canela/Marrón medio */
            --btn-bg: #4e342e;         /* Espresso */
            --btn-hover: #6d4c41;
            --info-bg: #efebe9;
            --border-radius: 16px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--primary-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(62, 39, 35, 0.15);
            max-width: 600px;
            width: 100%;
            transition: max-height 0.3s ease;
        }

        /* Encabezado */
        header { text-align: center; margin-bottom: 15px; }
        h1 { margin: 0; color: var(--primary-text); font-size: 1.8em; }
        .subtitle { color: #8d6e63; font-size: 0.9em; margin-bottom: 20px;}

        /* --- NUEVO: TABS --- */
        .tab-menu {
            display: flex;
            justify-content: center;
            background-color: var(--info-bg);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #8d6e63;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--btn-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Secciones de Inputs */
        .section-title {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1887f;
            margin-bottom: 10px;
            border-bottom: 1px solid #d7ccc8;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 0.9em; font-weight: 600; }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d7ccc8;
            border-radius: 8px;
            background-color: #fffefe;
            color: var(--primary-text);
            font-family: inherit;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--highlight); background-color: #fff; }

        /* Contenedor Advanced oculto por defecto */
        #advanced-section {
            display: none;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botón */
        .main-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--btn-bg);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .main-btn:hover { background-color: var(--btn-hover); }

        /* Resultados */
        #result { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .info-card {
            background-color: var(--info-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid var(--highlight);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .info-item h4 { margin: 0 0 5px 0; font-size: 0.8em; color: #6d4c41; }
        .info-item span { font-weight: bold; font-size: 1.1em; }

        .tips-box {
            font-size: 0.85em;
            color: #5d4037;
            background-color: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .step { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px dashed #d7ccc8; }
        .step:last-child { border-bottom: none; }
        .step-time { width: 70px; font-weight: 700; color: var(--highlight); }
        .step-desc { flex: 1; }
        .step-weight { font-weight: 600; color: var(--primary-text); }
        .step-add { font-size: 0.85em; color: #8d6e63; }

        /* Icono café */
        .coffee-bean {
            width: 20px; height: 30px; background: var(--btn-bg);
            border-radius: 50%; position: relative; margin: 0 auto 10px;
            box-shadow: inset 2px -2px 0 rgba(0,0,0,0.2);
        }
        .coffee-bean:after {
            content: ""; position: absolute; top: 5px; left: 50%; width: 2px; height: 20px;
            background: #fff; transform: translateX(-50%) rotate(10deg); border-radius: 2px; opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="coffee-bean"></div>
            <h1>Barista 4:6 Pro</h1>
            <div class="subtitle">Receta inteligente para V60</div>
            
            <div class="tab-menu">
                <button id="tab-pro" class="tab-btn active" onclick="setMode('pro')">Pro</button>
                <button id="tab-adv" class="tab-btn" onclick="setMode('advanced')">Advanced</button>
            </div>
        </header>

        <div class="section-title">Cantidades</div>
        <div class="row">
            <div class="col"><label>Café (g)</label><input type="number" id="coffee" value="20" min="1"></div>
            <div class="col"><label>Agua (ml)</label><input type="number" id="water" value="300" min="1"></div>
        </div>

        <div class="section-title">El Grano</div>
        <div class="row">
            <div class="col">
                <label>Variedad</label>
                <select id="bean">
                    <option value="">Desconocido</option>
                    <option value="arabica">Arábica (Standard)</option>
                    <option value="geisha">Geisha</option>
                    <option value="robusta">Robusta</option>
                    <option value="commercial">Comercial/Blend</option>
                </select>
            </div>
            <div class="col">
                <label>Proceso</label>
                <select id="process">
                    <option value="">Desconocido</option>
                    <option value="washed">Lavado (Washed)</option>
                    <option value="natural">Natural</option>
                    <option value="honey">Honey</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label>Nivel de Tueste</label>
                <select id="roast">
                    <option value="">Desconocido</option>
                    <option value="light">Claro (Light)</option>
                    <option value="medium">Medio</option>
                    <option value="dark">Oscuro (Dark)</option>
                </select>
            </div>
        </div>

        <div class="section-title">Perfil en Taza</div>
        <div class="row">
            <div class="col">
                <label>Sabor (Fase 1)</label>
                <select id="flavor">
                    <option value="standard">Balanceado</option>
                    <option value="sweeter">Más Dulce</option>
                    <option value="brighter">Más Ácido</option>
                </select>
            </div>
            <div class="col">
                <label>Fuerza (Fase 2)</label>
                <select id="strength">
                    <option value="lighter">Ligero</option>
                    <option value="stronger" selected>Medio</option>
                    <option value="even_stronger">Intenso</option>
                </select>
            </div>
        </div>

        <div id="advanced-section">
            <div class="section-title">Parámetros Avanzados</div>
            
            <div class="row">
                <div class="col">
                    <label>Altura (msnm)</label>
                    <input type="number" id="altitude" placeholder="Ej: 1880">
                </div>
                <div class="col">
                    <label>Temp. Ambiente (°C)</label>
                    <input type="number" id="ambient" placeholder="Ej: 22">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Filtro</label>
                    <select id="filter-type">
                        <option value="brown">Papel Marrón (Natural)</option>
                        <option value="white" selected>Papel Blanco</option>
                        <option value="mesh">Malla de Acero</option>
                        <option value="rice">Papel de Arroz</option>
                    </select>
                </div>
                <div class="col">
                    <label>Intervalos</label>
                    <select id="interval-mode">
                        <option value="fixed">Intervalos Fijos</option>
                        <option value="variable">Intervalos Variables</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Vertidos (Pulsos)</label>
                    <select id="pours-count">
                        <option value="auto">No especificado (Auto)</option>
                        <option value="2">2 Vertidos</option>
                        <option value="3">3 Vertidos</option>
                        <option value="4">4 Vertidos</option>
                        <option value="5">5 Vertidos (Estándar)</option>
                        <option value="6">6 Vertidos</option>
                        <option value="7">7 Vertidos</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="main-btn" onclick="generateRecipe()">Generar Receta Optimizada</button>

        <div id="result">
            <div class="info-card">
                <div class="info-item"><h4>Temp. Agua</h4><span id="res-temp">92°C</span></div>
                <div class="info-item"><h4>Intervalo</h4><span id="res-interval">45s</span></div>
                <div class="info-item"><h4>Ratio</h4><span id="res-ratio">1:15</span></div>
            </div>
            <div id="tips-box" class="tips-box"></div>
            <div id="steps-container"></div>
        </div>
    </div>

    <script>
        let currentMode = 'pro';

        function setMode(mode) {
            currentMode = mode;
            const advSection = document.getElementById('advanced-section');
            const btnPro = document.getElementById('tab-pro');
            const btnAdv = document.getElementById('tab-adv');

            if (mode === 'advanced') {
                advSection.style.display = 'block';
                btnAdv.classList.add('active');
                btnPro.classList.remove('active');
            } else {
                advSection.style.display = 'none';
                btnPro.classList.add('active');
                btnAdv.classList.remove('active');
                
                // Reset inputs avanzados al volver a Pro para evitar confusiones
                document.getElementById('pours-count').value = 'auto';
                document.getElementById('interval-mode').value = 'fixed';
            }
        }

        function generateRecipe() {
            // --- LECTURA DE INPUTS ---
            const coffee = parseFloat(document.getElementById('coffee').value);
            const waterTotal = parseFloat(document.getElementById('water').value);
            if (!coffee || !waterTotal) { alert("Por favor ingresa café y agua"); return; }

            const bean = document.getElementById('bean').value;
            const process = document.getElementById('process').value;
            const roast = document.getElementById('roast').value;
            const flavor = document.getElementById('flavor').value;
            const strength = document.getElementById('strength').value;

            // Inputs Avanzados
            const altitude = document.getElementById('altitude').value;
            const ambient = document.getElementById('ambient').value;
            const filterType = document.getElementById('filter-type').value;
            const intervalMode = document.getElementById('interval-mode').value;
            const poursCount = document.getElementById('pours-count').value;

            // --- LÓGICA DE TEMPERATURA ---
            let temp = 92; // Base
            
            // Ajuste por Tueste
            if (roast === 'light') temp = 94;
            else if (roast === 'medium') temp = 91;
            else if (roast === 'dark') temp = 83;

            // Ajuste por Grano
            if (bean === 'geisha' && roast !== 'dark') temp += 1;
            if (bean === 'robusta') temp -= 2;

            // Lógica Avanzada: Altitud y Ebullición
            // El agua hierve a aprox 100 - (h/300). Ejemplo: 1880m -> 100 - 6.2 = 93.8°C
            let boilingPoint = 100;
            if (currentMode === 'advanced' && altitude) {
                boilingPoint = 100 - (parseFloat(altitude) / 290); // Factor aprox
                if (temp > boilingPoint) {
                    temp = Math.floor(boilingPoint); // Ajustar al límite físico
                }
            }

            // Lógica Avanzada: Ambiente
            if (currentMode === 'advanced' && ambient) {
                const amb = parseFloat(ambient);
                if (amb < 18) temp += 2; // Compensa frío
                if (amb > 30) temp -= 1; // Compensa calor
            }

            // --- LÓGICA DE INTERVALOS ---
            let baseInterval = 45;
            if (process === 'natural' || process === 'honey') baseInterval += 5;
            if (roast === 'light') baseInterval += 5;
            if (roast === 'dark') baseInterval -= 5;

            // --- LÓGICA 4:6 MATEMÁTICA ---
            const phase1Total = waterTotal * 0.4;
            const phase2Total = waterTotal * 0.6;
            let pours = [];

            // Si el usuario fuerza el número de vertidos en Advanced
            if (currentMode === 'advanced' && poursCount !== 'auto') {
                const n = parseInt(poursCount);
                // Adaptación creativa del 4:6 para N vertidos
                // Siempre respetamos el 40/60 de volumen, pero cambiamos los pasos.
                
                if (n === 2) {
                    // 1 vertido para el 40% (Bloom gigante), 1 para el 60%
                    pours.push(phase1Total, phase2Total);
                } else if (n === 3) {
                    // 1 vertido para el 40%, 2 para el 60%
                    pours.push(phase1Total, phase2Total/2, phase2Total/2);
                } else {
                    // Para 4 o más, tratamos de dividir proporcionalmente
                    // Fase 1 siempre idealmente son 2 vertidos para controlar acidez/dulzor
                    // Fase 2 es el resto
                    let p1_steps = 2;
                    let p2_steps = n - 2;
                    
                    // Ajuste de sabor en Fase 1
                    let p1_v1 = phase1Total * 0.5;
                    let p1_v2 = phase1Total * 0.5;
                    
                    if (flavor === 'sweeter') { p1_v1 = phase1Total * (5/12); p1_v2 = phase1Total * (7/12); }
                    if (flavor === 'brighter') { p1_v1 = phase1Total * (7/12); p1_v2 = phase1Total * (5/12); }
                    
                    pours.push(p1_v1, p1_v2);
                    
                    // Fase 2 dividida equitativamente
                    for(let i=0; i<p2_steps; i++) pours.push(phase2Total / p2_steps);
                }

            } else {
                // LÓGICA AUTOMÁTICA (PRO)
                // Fase 1
                if (flavor === 'standard') pours.push(phase1Total * 0.5, phase1Total * 0.5);
                else if (flavor === 'sweeter') pours.push(phase1Total * (5/12), phase1Total * (7/12));
                else if (flavor === 'brighter') pours.push(phase1Total * (7/12), phase1Total * (5/12));

                // Fase 2
                let p2_count = (strength === 'lighter') ? 1 : (strength === 'stronger' ? 2 : 3);
                let p2_amount = phase2Total / p2_count;
                for(let i=0; i<p2_count; i++) pours.push(p2_amount);
            }

            // --- TIPS Y AJUSTES FINALES ---
            let tip = "Molienda media-gruesa (tipo sal marina).";
            if (filterType === 'mesh' && currentMode === 'advanced') {
                tip = "La malla metálica drena rápido. Muele un poco más fino para compensar.";
            }
            if (bean === 'geisha') tip += " Vierte suave para no agitar demasiado los finos.";
            if (currentMode === 'advanced' && altitude && temp < 94 && roast === 'light') {
                tip += ` Por tu altitud (${altitude}m), el agua hierve a ${Math.round(boilingPoint)}°C. Usa agua recién hervida.`;
            }

            // --- RENDERIZADO ---
            document.getElementById('res-temp').innerText = temp + "°C";
            document.getElementById('res-interval').innerText = (intervalMode === 'variable') ? "Variable" : "~" + baseInterval + "s";
            document.getElementById('res-ratio').innerText = "1:" + (waterTotal/coffee).toFixed(1);
            document.getElementById('tips-box').innerText = "💡 " + tip;

            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            let currentTotal = 0;
            let currentTime = 0;

            pours.forEach((amount, idx) => {
                currentTotal += amount;
                
                // Cálculo de tiempo
                let min = Math.floor(currentTime / 60);
                let sec = currentTime % 60;
                let timeStr = `${min}:${sec.toString().padStart(2, '0')}`;
                
                // Lógica de Intervalo Variable (Simulación de física)
                let stepInterval = baseInterval;
                if (currentMode === 'advanced' && intervalMode === 'variable') {
                    // Los primeros vertidos son más rápidos, los últimos más lentos (el filtro se tapa)
                    // Bloom: base. P2: base. P3: +5s. P4: +10s...
                    if (idx > 1) stepInterval += (idx - 1) * 5; 
                }

                const div = document.createElement('div');
                div.className = 'step';
                div.innerHTML = `
                    <div class="step-time">${timeStr}</div>
                    <div
                    class="step-desc">
                        <div class="step-weight">Verter hasta ${Math.round(currentTotal)}g</div>
                        <div class="step-add">(Agregar +${Math.round(amount)}g)</div>
                    </div>
                `;
                container.appendChild(div);

                currentTime += stepInterval;
            });

            // Final
            let endMin = Math.floor((currentTime + 10) / 60);
            let endSec = (currentTime + 10) % 60;
            
            const finalDiv = document.createElement('div');
            finalDiv.className = 'step';
            finalDiv.innerHTML = `
                <div class="step-time">~${endMin}:${endSec.toString().padStart(2, '0')}</div>
                <div class="step-desc">
                    <div class="step-weight">Remover Dripper</div>
                    <div class="step-add">¡Disfruta tu café!</div>
                </div>
            `;
            container.appendChild(finalDiv);

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').scrollIntoView({behavior: 'smooth'});
        }
    </script>
</body>
</html>
